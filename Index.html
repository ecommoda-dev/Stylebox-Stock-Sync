<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=./index.html">
<title>الأداة اتنقلت — سجل مزامنة استوك WordPress</title>
<style>
  body{
    font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:#f3f4f6; color:#111827;
    min-height:100vh; margin:0; padding:24px;
    display:flex; align-items:center; justify-content:center;
    direction:rtl;
  }
  .card{
    background:#fff; border:1px solid #e5e7eb; border-radius:16px;
    box-shadow:0 4px 24px rgba(0,0,0,.07);
    max-width:420px; width:100%; padding:28px; text-align:center;
  }
  h1{font-size:17px; font-weight:800; margin:0 0 10px}
  p{font-size:13px; line-height:1.9; color:#6b7280; margin:0 0 18px}
  a{
    display:inline-block; background:#2563eb; color:#fff;
    text-decoration:none; font-weight:800; font-size:14px;
    padding:12px 22px; border-radius:8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>الرابط ده اتغيّر</h1>
    <p>
      الصفحة بتتحوّل لوحدها خلال لحظة.<br>
      لو مااتحوّلتش، اضغط الزرار — وحدّث الـ bookmark بالرابط الجديد.
    </p>
    <a href="./index.html">افتح الأداة</a>
  </div>
</body>
</html>
